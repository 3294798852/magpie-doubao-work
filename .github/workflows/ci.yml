name: Cross-platform CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - name: Restore installed Edge sandbox permissions
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root /opt/microsoft/msedge/msedge-sandbox
          sudo chmod 4755 /opt/microsoft/msedge/msedge-sandbox
      - name: Test the real browser sign-in entry
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- node scripts/browser-smoke.mjs
          else
            node scripts/browser-smoke.mjs
          fi
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
          NODE_USE_ENV_PROXY: '1'
  browser-bun:
    name: Browser (windows-2025, Bun ${{ matrix.bun }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        bun: [1.3.14, 1.4.5]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test real Chrome and Edge with Bun
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'doubao-browser-bun.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'doubao-browser-bun'
          Invoke-WebRequest -Uri 'https://github.com/oven-sh/bun/releases/download/bun-v${{ matrix.bun }}/bun-windows-x64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = ''
          $env:NODE_USE_ENV_PROXY = '1'
          & (Join-Path $runtime 'bun-windows-x64/bun.exe') scripts/browser-smoke.mjs
          exit $LASTEXITCODE
